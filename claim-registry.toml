# Canonical claim registry (fanout-output US 07).
#
# Data asset read by `tests/claim_fanout.rs` — the fan-out + agreement guard.
# No runtime code reads this file; the guard is a test surface. Each entry maps
# a claim id to its owner surface and its exact canonical text (or, for a
# computed claim, the rendered lines the computation owns). `signatures` are
# the fingerprint substrings that mark an occurrence of the claim family in any
# scanned surface: an occurrence not covered by canonical bytes is a stale
# echo and fails the guard. Payload-neutral: neutral example paths only, no
# internal identifiers (the publish leak guard stays the backstop).
#
# Field reference (consumed only by tests/claim_fanout.rs):
#   id                    claim identity
#   owner                 the owning binary surface, in words an agent acts on
#   owner_surfaces        rendered-surface keys where the claim may live verbatim
#   relations             relations a NON-owner surface may have to the text:
#                         "echo" (byte-identical) and/or "cite" (pointer only;
#                         a citation contains no signature bytes by definition)
#   canonical             exact canonical text; `<path>` is a single-token
#                         placeholder when `template = true`
#   canonical_fragments   canonical text owned by a computed surface, line-wise
#   template              canonical carries `<path>` placeholders
#   signatures            family fingerprints (case-insensitive, word-initial)
#   dedicated_guard       the test file holding the family's dedicated assertion
#   [[claim.guard_pin]]   cross-check of registry bytes against that guard's
#                         source constants: relation is "equals-canonical",
#                         "contained-in-canonical", "equals-fragments",
#                         "subset-of-signatures" or "named-in-file"

