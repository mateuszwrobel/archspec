name: Release archspec binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools dpkg-dev libarchive-tools zstd
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package tarball
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bin="target/x86_64-unknown-linux-musl/release/archspec"
          pkg="archspec-${ver}-x86_64-unknown-linux-musl.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$pkg" archspec
          sha256sum "$pkg" > "$pkg.sha256"
      - name: Package deb
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          stage="deb-archspec"
          mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: archspec
          Version: ${ver}
          Architecture: amd64
          Maintainer: archspec developers <publisher@archspec.invalid>
          Description: Architecture conformance toolkit
           Parses source trees into an architectural model and verifies it
           against a declarative specification. No toolchain required.
          EOF
          install -m 755 target/x86_64-unknown-linux-musl/release/archspec "$stage/usr/bin/archspec"
          dpkg-deb --build "$stage" "archspec_${ver}_amd64.deb"
          sha256sum "archspec_${ver}_amd64.deb" > "archspec_${ver}_amd64.deb.sha256"
      - name: Package Arch
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          PKG_URL="https://github.com/${{ github.repository }}" \
            sh package-arch.sh target/x86_64-unknown-linux-musl/release/archspec x86_64 "$ver"
          pkg="archspec-${ver}-1-x86_64.pkg.tar.zst"
          sha256sum "$pkg" > "$pkg.sha256"
      - name: Check Arch package contents
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          sh check-arch-package.sh "archspec-${ver}-1-x86_64.pkg.tar.zst" x86_64 \
            target/x86_64-unknown-linux-musl/release/archspec
      - name: Install Arch package with pacman
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pkg="archspec-${ver}-1-x86_64.pkg.tar.zst"
          # The official image gives a stock pacman with nothing configured; a
          # local file needs no keyring and no database sync, so this is offline.
          docker run --rm -e PKG="$pkg" -v "$PWD:/w:ro" -w /w archlinux:latest \
            sh /w/install-check-arch-package.sh "/w/$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            archspec-*.tar.gz
            archspec-*.tar.gz.sha256
            archspec_*.deb
            archspec_*.deb.sha256
            archspec-*.pkg.tar.zst
            archspec-*.pkg.tar.zst.sha256

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev libarchive-tools zstd
      - run: cargo build --release --target aarch64-unknown-linux-gnu
      # The Arch package carries a static binary: Arch gives no guarantee about
      # the glibc a package will run against, and there is no dependency list to
      # record for a glibc build that would hold on both Arch and Arch Linux ARM.
      - run: cargo build --release --target aarch64-unknown-linux-musl
      - name: Package tarball
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bin="target/aarch64-unknown-linux-gnu/release/archspec"
          pkg="archspec-${ver}-aarch64-unknown-linux-gnu.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$pkg" archspec
          sha256sum "$pkg" > "$pkg.sha256"
      - name: Package deb
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          stage="deb-archspec"
          mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: archspec
          Version: ${ver}
          Architecture: arm64
          Maintainer: archspec developers <publisher@archspec.invalid>
          Description: Architecture conformance toolkit
           Parses source trees into an architectural model and verifies it
           against a declarative specification. No toolchain required.
          EOF
          install -m 755 target/aarch64-unknown-linux-gnu/release/archspec "$stage/usr/bin/archspec"
          dpkg-deb --build "$stage" "archspec_${ver}_arm64.deb"
          sha256sum "archspec_${ver}_arm64.deb" > "archspec_${ver}_arm64.deb.sha256"
      - name: Package Arch
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          PKG_URL="https://github.com/${{ github.repository }}" \
            sh package-arch.sh target/aarch64-unknown-linux-musl/release/archspec aarch64 "$ver"
          pkg="archspec-${ver}-1-aarch64.pkg.tar.zst"
          sha256sum "$pkg" > "$pkg.sha256"
      # There is no official Arch arm64 image, so no pacman can run here to
      # install the result. Everything a container check would assert about the
      # archive itself is asserted instead; the x86_64 job proves the same
      # packaging code installs, and the runner is arm64 hardware.
      - name: Check Arch package contents
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          sh check-arch-package.sh "archspec-${ver}-1-aarch64.pkg.tar.zst" aarch64 \
            target/aarch64-unknown-linux-musl/release/archspec
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            archspec-*.tar.gz
            archspec-*.tar.gz.sha256
            archspec_*.deb
            archspec_*.deb.sha256
            archspec-*.pkg.tar.zst
            archspec-*.pkg.tar.zst.sha256

  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pkg="archspec-${ver}-x86_64-apple-darwin.tar.gz"
          tar -C target/x86_64-apple-darwin/release -czf "$pkg" archspec
          shasum -a 256 "$pkg" > "$pkg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: archspec-*

  build-macos-aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pkg="archspec-${ver}-aarch64-apple-darwin.tar.gz"
          tar -C target/aarch64-apple-darwin/release -czf "$pkg" archspec
          shasum -a 256 "$pkg" > "$pkg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: archspec-*

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = "target/release/archspec.exe"
          $zip = "archspec-$ver-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() | Set-Content "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: archspec-*

  release:
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-x86_64
      - build-macos-aarch64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$(git tag -l --format='%(contents:body)' "$tag")"
          if [ -z "$notes" ]; then
            notes="archspec ${tag#v}"
          fi
          printf '%s\n' "$notes" > /tmp/release-notes.md
          gh release create "$tag" --title "archspec ${tag#v}" --notes-file /tmp/release-notes.md
          gh release upload "$tag" dist/* --clobber
          echo "released ${tag}:"
          gh release view "$tag" --json assets -q '.assets[].name'
