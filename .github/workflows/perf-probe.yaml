name: Perf probe (issue #33 guard)

# Release witness, gate-free and build-free (operator decision 2026-11-17):
# this workflow gates NOTHING and compiles NOTHING. It fires ONLY when the
# release workflow completes successfully on a vX.Y.Z ref. The retired
# push-tags arm raced the release's own asset upload — the download step met
# release pages whose assets were not up yet (run ids 43931896825,
# 43798104263) — and the retired schedule arm benched nothing anybody had
# shipped. Watching the completed release workflow removes both: the assets
# exist by construction and every measurement names a real binary.
#
# Each matrix leg downloads its platform binary FROM THE COMPLETED RELEASE
# with the established asset naming (archspec-<version>-<target-triple>.tar.gz
# plus the msvc zip, version stripped from the release ref) and benches
# THAT binary with the committed corpus and the established protocol —
# medians of 3 after one discarded warmup. Legs are native (M1: cross-arch
# timing under emulation fabricates the table), so every asset runs on the
# hardware its matrix entry names.
#
# The ratio assert is OBSERVE-NEVER-BLOCK: a breach writes a step-summary
# section plus a warning annotation and the step still exits 0 — perf
# results never fail anything here (operator ruling 2026-11-17). Infra
# breakage — asset download, extraction, the corpus guard, a bench crash —
# is probe breakage and may go red. Absolute numbers print to the step
# summary and a metrics.json artifact (trend class; the store decision
# belongs to the perf program).

on:
  # A release:published trigger NEVER fires here: release.yml creates the
  # release with GH_TOKEN=${{ github.token }}, and GitHub's loop-prevention
  # suppresses workflow runs for events created by GITHUB_TOKEN, so the
  # release event produced zero probe runs (v0.6.76 chain: release run
  # 44033038817 green, no event=release run). workflow_run fires AFTER the
  # release workflow completes — the release and its assets exist by then,
  # so the asset download stays simple — and it is not subject to that
  # suppression because it keys off the workflow run, not the token that
  # made the release. The version/tag is the completion's head_branch (the
  # vX.Y.Z tag), guarded below to successful runs on v refs only. NOTE: a
  # workflow_run-triggered workflow only fires from the file as it exists on
  # the DEFAULT branch, so the first probe run under this arm is expected on
  # the NEXT release after this file lands on the mirror main branch.
  workflow_run:
    workflows: ["Release archspec binaries"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: perf-probe-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  bench:
    # Only a SUCCESSFUL release-workflow completion on a vX.Y.Z ref benches
    # anything; a failed or untagged completion skips before any runner cost.
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Asset naming follows release.yml / the build matrix; each runner
          # is the hardware its asset was built for (ubuntu-latest x86_64,
          # ubuntu-24.04-arm aarch64, macos-26 arm64 — the label the release
          # workflows ship on — windows-latest x86_64): native benches only.
          - os: ubuntu-latest
            label: linux-x86_64
            asset: x86_64-unknown-linux-musl.tar.gz
            bin: shipped-musl
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            asset: aarch64-unknown-linux-gnu.tar.gz
            bin: shipped-gnu
          - os: macos-26
            label: darwin-arm64
            asset: aarch64-apple-darwin.tar.gz
            bin: shipped-darwin
          - os: windows-latest
            label: windows-x64
            asset: x86_64-pc-windows-msvc.zip
            bin: shipped-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate corpus + guard (refuses before timing when short or drifted)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bench/gen_corpus.py bench-tree 800 25
          python3 scripts/bench/bench_sweep.py guard \
            --corpus bench-tree --manifest scripts/bench/corpus-manifest.txt
      - name: Corpus-guard self-test (a stub tree must refuse, nonzero)
        shell: bash
        run: python3 scripts/bench/bench_sweep.py self-test
      - name: Download and extract the release asset for this platform
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          ver="${RELEASE_REF#v}"
          asset="archspec-${ver}-${{ matrix.asset }}"
          mkdir -p bench-bin bench-extract
          gh release download "${RELEASE_REF}" -p "${asset}" -D bench-bin
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            powershell -NoProfile -Command "Expand-Archive -Force -Path bench-bin/$asset -DestinationPath bench-extract"
          else
            tar xzf "bench-bin/${asset}" -C bench-extract
          fi
          if [ -f bench-extract/archspec ]; then
            mv bench-extract/archspec "bench-bin/${{ matrix.bin }}"
            chmod +x "bench-bin/${{ matrix.bin }}"
          elif [ -f bench-extract/archspec.exe ]; then
            mv bench-extract/archspec.exe "bench-bin/${{ matrix.bin }}.exe"
          else
            echo "perf-probe: ${asset} extracted no archspec binary" >&2
            exit 1
          fi
      - name: Bench the shipped binary (medians of 3 after one discarded warmup)
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [ "${RUNNER_OS:-}" = "Windows" ] && exe=".exe"
          python3 scripts/bench/bench_sweep.py bench \
            --corpus bench-tree --manifest scripts/bench/corpus-manifest.txt \
            --reps 3 --deadline 900 --out metrics.json \
            --bin "${{ matrix.bin }}=bench-bin/${{ matrix.bin }}${exe}" | tee bench-report.tsv
      - name: Assert ratios (observe-never-block: a breach annotates, never fails)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          rows = {r["binary"]: r for r in json.load(open("metrics.json"))["rows"]}
          problems = [f"{n}: parallel/serial ratio {r['ratio']:.2f} > 1.15 (inversion)"
                      for n, r in rows.items() if r["ratio"] > 1.15]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## perf probe (${{ matrix.label }})\n\n")
              for n, r in rows.items():
                  rss = f", peak RSS {r['rss_p_kb'] // 1024} MB" if r.get("rss_p_kb") else ""
                  fh.write(f"- `{n}`: parallel {r['wall_p']:.2f}s, serial {r['wall_s']:.2f}s, "
                           f"ratio {r['ratio']:.2f}{rss}\n")
              if problems:
                  line = " | ".join(problems)
                  fh.write(f"\n**BREACH (observed, not blocking):** {line}\n")
                  print(f"::warning::{line}")
              else:
                  fh.write("\n**within bounds**\n")
          print("perf-probe: ratios observed — the assert never blocks")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: perf-metrics-${{ matrix.label }}-${{ github.run_id }}
          path: |
            metrics.json
            bench-report.tsv
        if: always()
