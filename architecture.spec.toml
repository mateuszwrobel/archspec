[project]
language = "rust"
# The npm installer package ships beside the crate: node sources with their
# own package.json marker, not part of the Rust model (ADR-051). Its guards
# live in tests/npm_channel.rs and npm/test/; the language agreement check
# must never count them.
excluded_sources = [ { path = "npm", reason = "the npm installer package — node sources with their own marker, verified by tests/npm_channel.rs" }, { path = "scripts/bench", reason = "the issue #33 parity bench tooling — python corpus generator and sweep harness, exercised by the runner self-test leg and the perf-probe workflow, not part of the Rust model" } ]

# CLI layer: the binary entrypoint, the module tree that wires commands, and one
# prefix claim over the per-command submodules.
[[module]]
name = "commands"
matches = { modules = [
  "archspec::main",
  "archspec::archspec",
  "archspec::archspec::commands*",
] }

[module.allowed]
depend_on = ["engines", "foundations", "scan-core"]

# Analysis engines: each engine lives in its own module subtree, claimed by
# prefix so nested submodules fold into the same boundary — the depgraph
# projection module included, since `commands depgraph` consumes it exactly
# like the other commands consume their engines. The binary unit itself is
# attributed here because a cross-crate `use` of the library surfaces in the
# model as the unit-tier `archspec -> rust-arch-test-kit` edge only — it
# carries no module endpoints, so attribution follows this pattern list, not
# the code. Which files actually import the library is a source-level fact
# owned by `tests/lib_imports_guard.rs` with an explicit allowlist: the graph
# engines (depgraph, diagram), the inspect renderers, the re-export shims
# (mod.rs, model.rs, language.rs, profile.rs), the scan CLI glue, the spec
# loader and the pattern shim.
[[module]]
name = "engines"
matches = { units = ["archspec"], modules = [
  "archspec::archspec::verify*",
  "archspec::archspec::depgraph*",
  "archspec::archspec::diagram*",
  "archspec::archspec::report*",
  "archspec::archspec::update*",
  "archspec::archspec::inspect*",
  "archspec::archspec::init*",
] }

[module.allowed]
# `events` joins the allowlist with the first consumer of the ONE canonical
# unit-id site: the declaration arms (`verify::compare::declarations`) resolve
# every declared producer through `events::unitid`, the same single owner the
# scenario-01 note above reserves this edge for.
depend_on = ["foundations", "rust-arch-test-kit", "scan-core", "events"]

# Shared foundations: the spec schema, CLI parsing, config and capability, and
# the language-detection/help surfaces. Depends on nothing. The model,
# language and profile identities also appear here: their engines compile into
# the library, and the binary's thin re-export modules keep every
# `crate::archspec::model::…` spelling as an edge to this group while the
# files themselves live in the lib groups below.
[[module]]
name = "foundations"
matches = { modules = [
  "archspec::archspec::model*",
  "archspec::archspec::spec*",
  "archspec::archspec::cli*",
  "archspec::archspec::config*",
  "archspec::archspec::language*",
  "archspec::archspec::capability*",
  "archspec::archspec::helptext*",
  "archspec::archspec::profile*",
] }

# The fact-events layer (ADR-069 clause 4.4a): the machinery every
# multi-producer fact writer shares — the canonical unit-id resolution site
# (`events::unitid`) is exactly ONE site by law, so the tree-root
# canonicalization rule has exactly one owner in the tree. The site is
# std-only today (directories and opaque spellings), so the honest allowlist
# is empty; the model-fact reader that joins the allowlist arrives with the
# first writer (engine-boundary law: generic resolution rules, no ecosystem
# vocabulary, no engine->scan import).
[[module]]
name = "events"
matches = { modules = ["archspec::archspec::events*"] }

[module.allowed]
# The first writer arrived with the literal-site pattern primitives
# (workplan events_value_join scenario 03): `events::patterns` reads the
# model's candidate feed and writes the model's literal-site collection —
# the F8 seam consumes MODEL FACTS only, so the join stays import-free of
# the scan engine (ADR-069 4.7(i): no engine→scan edge). The import rides
# the binary's thin `archspec::model` re-export, so the edge lands on
# `foundations`, where every `crate::archspec::model::…` spelling lives.
depend_on = ["foundations"]

# Library crate boundary (the engine the binary links). The crate-root module
# of the lib unit resolves here as the facade; its internal modules are claimed
# by the prefix groups below (longest-prefix wins over this unit fallback). The
# facade wires the engine modules with `mod` declarations only — it imports
# nothing from them, so it declares no allowed dependencies.
[[module]]
name = "rust-arch-test-kit"
matches = { units = ["rust-arch-test-kit"] }

# Library internals: prefix groups over one unit so `no_cycles` sees inside the
# lib. The file tier reaches these groups by identity, not absorption: this
# manifest spells two units at `path = "."`, and since the GitHub issue #29 fix
# a file's unit — hence its module identity — is the unit its `file_edges` rows
# carry, never the order of the unit list, so lib files project
# `rust-arch-test-kit::*` and these groups claim them directly (before that fix
# the tie landed them under the bin unit and only `engines` co-declared in the
# `no_cycles` constraint kept lib file visibility engaged). These groups exist
# for that cycle visibility only — the lib is one shared engine, and it is the
# `engines` modules that import it; nothing beyond acyclicity is policed
# between them. The scan engine moved into the lib (extraction rung one): the
# scan groups below claim the lib identities, and the binary keeps only the
# CLI glue module `archspec::archspec::scan`, which `scan-core` also claims.
[[module]]
name = "lib-collector"
matches = { modules = ["rust-arch-test-kit::collector*"] }

[module.allowed]
depend_on = []

[[module]]
name = "lib-render"
matches = { modules = ["rust-arch-test-kit::render*"] }

[module.allowed]
depend_on = []

[[module]]
name = "lib-model"
matches = { modules = ["rust-arch-test-kit::model*"] }

[module.allowed]
depend_on = []

# The driver-port seam (workplan events_value_join scenario 10, ADR-069
# Decision 5's ports rung): one object-safe trait naming only the model
# vocabulary — `Path`, `Model`, `DeclaredFacts` — so the port itself imports
# nothing but the model. The compile-time table lives in `scan-core`
# (`scan::driver`): the host dispatches through the port, the drivers
# implement it; the drivers' groups add `lib-driver` to their `depend_on`.
[[module]]
name = "lib-driver"
matches = { modules = ["rust-arch-test-kit::driver"] }

[module.allowed]
depend_on = ["lib-model"]

[[module]]
name = "lib-language"
matches = { modules = ["rust-arch-test-kit::language*"] }

[module.allowed]
depend_on = []

[[module]]
name = "lib-parse"
matches = { modules = ["rust-arch-test-kit::parse*"] }

[module.allowed]
depend_on = ["lib-language"]

[[module]]
name = "lib-profile"
matches = { modules = ["rust-arch-test-kit::profile*"] }

[module.allowed]
depend_on = []

# Scan-internal zones (self-audit F1 cycle break): the scan host and the
# language drivers are separate boundaries so the driver -> host helper ring
# can never come back — `no_cycles` below and the exact `depend_on` tables
# gate recurrence. `leg` is the leaf both the host and the drivers call for
# the parallel fact leg; `scan-ts` folds `ts::common`, the vocabulary leaf
# `ts` and `ts::resolution` share. The driver identities moved into the lib
# with the scan engine; the binary's CLI glue `archspec::archspec::scan`
# rides `scan-core` as the host's report-surface twin, and the textual
# re-export endpoints (`scan::csharp`, `scan::go`) score through its exact
# entry. `engines` keeps no scan pattern: a `scan*` catch-all would tie with
# the exact `scan` entry on every scan descendant (ancestor scoring in
# verify's specificity) and report ambiguity.
[[module]]
name = "scan-core"
matches = { modules = [
  "archspec::archspec::scan",
  "rust-arch-test-kit::scan",
  "rust-arch-test-kit::scan::csharp*",
  "rust-arch-test-kit::scan::go*",
  "rust-arch-test-kit::scan::rust*",
] }

[module.allowed]
# `events` joins with the literal-site resolution seam (workplan
# events_value_join scenario 03): the scan command's `extract_with_spec`
# resolves the funded drivers' candidate feed through the ONE binary-side
# seam into the model's literal-site collection.
depend_on = [
  "events",
  "foundations",
  "lib-collector",
  "lib-driver",
  "lib-language",
  "lib-model",
  "lib-parse",
  "scan-kotlin",
  "scan-python",
  "scan-ts",
]

[[module]]
name = "scan-leg"
matches = { modules = ["rust-arch-test-kit::scan::leg"] }

[module.allowed]
depend_on = []

[[module]]
name = "scan-ts"
matches = { modules = ["rust-arch-test-kit::scan::ts*"] }

[module.allowed]
depend_on = ["lib-driver", "lib-language", "lib-model", "lib-parse", "lib-profile", "scan-leg"]

[[module]]
name = "scan-python"
matches = { modules = ["rust-arch-test-kit::scan::python*"] }

[module.allowed]
depend_on = ["lib-driver", "lib-language", "lib-model", "lib-parse", "lib-profile", "scan-leg"]

[[module]]
name = "scan-kotlin"
matches = { modules = ["rust-arch-test-kit::scan::kotlin*"] }

[module.allowed]
depend_on = ["lib-driver", "lib-language", "lib-model", "lib-parse", "lib-profile", "scan-leg"]

# --- The crate's own constraint surface --------------------------------------
# Four of the seven constraint types are declared on this crate: `no_cycles`
# over the boundary groups, `public_api_allowlist` over the library root,
# `forbid_external_crates` over the foundations layer, and
# `manifest_integrity` over the publishable manifests. The other three model
# surfaces this crate has none of: feature-gated modules (`feature_boundary`),
# an external-free leaf layer (`external_free` — even foundations imports
# serde) and parentage among submodules (`forbid_submodule_dependency`).
# Test-gated modules (`#[cfg(test)]` trees) and whatever only they import are
# excluded from `depend_on` comparison — the same rule the `depgraph --help`
# statement records — and this crate keeps even those imports pointed
# down-layer rather than leaning on the exemption.

[[constraint]]
type = "no_cycles"
modules = ["commands", "engines", "foundations", "rust-arch-test-kit", "events"]

[[constraint]]
type = "no_cycles"
modules = [
  "engines",
  "rust-arch-test-kit",
  "lib-collector",
  "lib-render",
  "lib-model",
  "lib-driver",
  "lib-language",
  "lib-parse",
  "lib-parse",
  "scan-core",
  "scan-leg",
  "scan-ts",
  "scan-python",
  "scan-kotlin",
]

# The library root re-exports exactly the collector, the render primitives,
# the scan engine and the model/language/parse/profile vocabulary it walks
# with — nothing else, named or glob-resolved.
[[constraint]]
type = "public_api_allowlist"
allowed = ["collector", "render", "language", "model", "parse", "profile", "scan"]

# Grammar machinery is the parse engine's job, not layer zero's: the modules
# that model, spec-schema, CLI-parsing, config, capability, language detection
# and the diagnostics-help catalog live in must not import tree-sitter (or its
# grammars) or syn. The model and language identities moved into the library,
# so the lib spellings join the from-list next to the facade-endpoint
# spellings. The pinned ts resolution layer lives in the scan layer and
# nowhere else (ADR-024): oxc_resolver joins the forbid list so a resolver
# import outside the scan arm reddens this crate's own verify — law, not
# convention. walkdir deliberately stays off this list — foundations'
# language detection legitimately walks directories with it.
[[constraint]]
type = "forbid_external_crates"
from = [
  "archspec::archspec::model",
  "rust-arch-test-kit::model",
  "archspec::archspec::spec",
  "archspec::archspec::cli",
  "archspec::archspec::config",
  "archspec::archspec::language",
  "rust-arch-test-kit::language",
  "archspec::archspec::capability",
  "archspec::archspec::helptext",
]
forbid = ["tree_sitter", "tree_sitter_c_sharp", "tree_sitter_go", "syn", "oxc_resolver"]

# Both units ship from one publishable manifest: `publish = ["gitea"]`
# flattens to publishable, and the per-unit manifests deduplicate to a single
# Cargo.toml target. The model's manifest view carries regular dependencies
# only — dev-dependencies never reach it, so this constraint pins nothing
# about them.
[[constraint]]
type = "manifest_integrity"
require_publish = true

# F1 recurrence gate: the scan zones above form their own cycle group. A
# reintroduced driver -> host helper call closes `scan-core -> <driver> ->
# scan-core` here (and fires the `disallowed cross-component dependency`
# table at the same time). `engines` stays out of the group: folding inspect
# and parse into one node manufactures a pair-cycle the module tier does not
# have (decision-check record, MAJOR finding).
[[constraint]]
type = "no_cycles"
modules = ["scan-core", "scan-leg", "scan-ts", "scan-python", "scan-kotlin"]
