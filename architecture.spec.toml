[project]
language = "rust"
# The npm installer package ships beside the crate: node sources with their
# own package.json marker, not part of the Rust model (ADR-051). Its guards
# live in tests/npm_channel.rs and npm/test/; the language agreement check
# must never count them.
excluded_sources = [ { path = "npm", reason = "the npm installer package — node sources with their own marker, verified by tests/npm_channel.rs" } ]

# CLI layer: the binary entrypoint, the module tree that wires commands, and one
# prefix claim over the per-command submodules.
[[module]]
name = "commands"
matches = { modules = [
  "archspec::main",
  "archspec::archspec",
  "archspec::archspec::commands*",
] }

[module.allowed]
depend_on = ["engines", "foundations", "scan-core"]

# Analysis engines: each engine lives in its own module subtree, claimed by
# prefix so nested submodules fold into the same boundary — the depgraph
# projection module included, since `commands depgraph` consumes it exactly
# like the other commands consume their engines. The binary unit itself is
# attributed here because a cross-crate `use` of the library surfaces in the
# model as the unit-tier `archspec -> rust-arch-test-kit` edge only — it
# carries no module endpoints, so attribution follows this pattern list, not
# the code. Which files actually import the library is a source-level fact
# owned by `tests/lib_imports_guard.rs` with an explicit allowlist: the graph
# engines (depgraph, diagram), the inspect renderers and the rust scan driver.
[[module]]
name = "engines"
matches = { units = ["archspec"], modules = [
  "archspec::archspec::verify*",
  "archspec::archspec::depgraph*",
  "archspec::archspec::diagram*",
  "archspec::archspec::report*",
  "archspec::archspec::update*",
  "archspec::archspec::inspect*",
  "archspec::archspec::init*",
  "archspec::archspec::parse*",
] }

[module.allowed]
depend_on = ["foundations", "rust-arch-test-kit", "scan-core", "scan-ts", "scan-python", "scan-kotlin"]

# Shared foundations: the extracted model, the spec schema, CLI parsing, config
# and language detection. Depends on nothing.
[[module]]
name = "foundations"
matches = { modules = [
  "archspec::archspec::model*",
  "archspec::archspec::spec*",
  "archspec::archspec::cli*",
  "archspec::archspec::config*",
  "archspec::archspec::language*",
  "archspec::archspec::capability*",
  "archspec::archspec::helptext*",
] }

# Library crate boundary (the engine the binary links). The crate-root module
# of the lib unit resolves here as the facade; its internal modules are claimed
# by the prefix groups below (longest-prefix wins over this unit fallback). The
# facade wires the engine modules with `mod` declarations only — it imports
# nothing from them, so it declares no allowed dependencies.
[[module]]
name = "rust-arch-test-kit"
matches = { units = ["rust-arch-test-kit"] }

# Library internals: prefix groups over one unit so `no_cycles` sees inside the
# lib. These groups exist for that cycle visibility only — the lib is one
# shared parsing/rendering engine, and it is the `engines` modules that import
# it; nothing beyond acyclicity is policed between collector and render.
[[module]]
name = "lib-collector"
matches = { modules = ["rust-arch-test-kit::collector*"] }

[[module]]
name = "lib-render"
matches = { modules = ["rust-arch-test-kit::render*"] }


# Scan-internal zones (self-audit F1 cycle break): the scan host and the
# language drivers are separate boundaries so the driver -> host helper ring
# can never come back — `no_cycles` below and the exact `depend_on` tables
# gate recurrence. `leg` is the leaf both the host and the drivers call for
# the parallel fact leg; `scan-ts` folds `ts::common`, the vocabulary leaf
# `ts` and `ts::resolution` share. `engines` keeps no scan pattern: the
# `scan*` catch-all would tie with the exact `scan` entry on every scan
# descendant (ancestor scoring in verify's specificity) and report
# ambiguity.
[[module]]
name = "scan-core"
matches = { modules = [
  "archspec::archspec::scan",
  "archspec::archspec::scan::csharp*",
  "archspec::archspec::scan::go*",
  "archspec::archspec::scan::rust*",
] }

[module.allowed]
depend_on = ["foundations", "engines", "scan-ts", "scan-python", "scan-kotlin"]

[[module]]
name = "scan-leg"
matches = { modules = ["archspec::archspec::scan::leg"] }

[module.allowed]
depend_on = []

[[module]]
name = "scan-ts"
matches = { modules = ["archspec::archspec::scan::ts*"] }

[module.allowed]
depend_on = ["foundations", "engines", "scan-leg"]

[[module]]
name = "scan-python"
matches = { modules = ["archspec::archspec::scan::python*"] }

[module.allowed]
depend_on = ["foundations", "engines", "scan-leg"]

[[module]]
name = "scan-kotlin"
matches = { modules = ["archspec::archspec::scan::kotlin*"] }

[module.allowed]
depend_on = ["foundations", "engines", "scan-leg"]

# --- The crate's own constraint surface --------------------------------------
# Four of the seven constraint types are declared on this crate: `no_cycles`
# over the boundary groups, `public_api_allowlist` over the library root,
# `forbid_external_crates` over the foundations layer, and
# `manifest_integrity` over the publishable manifests. The other three model
# surfaces this crate has none of: feature-gated modules (`feature_boundary`),
# an external-free leaf layer (`external_free` — even foundations imports
# serde) and parentage among submodules (`forbid_submodule_dependency`).
# Test-gated modules (`#[cfg(test)]` trees) and whatever only they import are
# excluded from `depend_on` comparison — the same rule the `depgraph --help`
# statement records — and this crate keeps even those imports pointed
# down-layer rather than leaning on the exemption.

[[constraint]]
type = "no_cycles"
modules = ["commands", "engines", "foundations", "rust-arch-test-kit"]

[[constraint]]
type = "no_cycles"
modules = ["engines", "rust-arch-test-kit", "lib-collector", "lib-render"]

# The library root re-exports exactly the collector and the render primitives —
# nothing else, named or glob-resolved.
[[constraint]]
type = "public_api_allowlist"
allowed = ["collector", "render"]

# Grammar machinery is the parse engine's job, not layer zero's: the modules
# that model, spec-schema, CLI-parsing, config, capability, language detection
# and the diagnostics-help catalog live in must not import tree-sitter (or its
# grammars) or syn. The pinned ts resolution layer lives in the scan layer and
# nowhere else (ADR-024): oxc_resolver joins the forbid list so a resolver
# import outside the scan arm reddens this crate's own verify — law, not
# convention. walkdir deliberately stays off this list — foundations'
# language detection legitimately walks directories with it.
[[constraint]]
type = "forbid_external_crates"
from = [
  "archspec::archspec::model",
  "archspec::archspec::spec",
  "archspec::archspec::cli",
  "archspec::archspec::config",
  "archspec::archspec::language",
  "archspec::archspec::capability",
  "archspec::archspec::helptext",
]
forbid = ["tree_sitter", "tree_sitter_c_sharp", "tree_sitter_go", "syn", "oxc_resolver"]

# Both units ship from one publishable manifest: `publish = ["gitea"]`
# flattens to publishable, and the per-unit manifests deduplicate to a single
# Cargo.toml target. The model's manifest view carries regular dependencies
# only — dev-dependencies never reach it, so this constraint pins nothing
# about them.
[[constraint]]
type = "manifest_integrity"
require_publish = true

# F1 recurrence gate: the scan zones above form their own cycle group. A
# reintroduced driver -> host helper call closes `scan-core -> <driver> ->
# scan-core` here (and fires the `disallowed cross-component dependency`
# table at the same time). `engines` stays out of the group: folding inspect
# and parse into one node manufactures a pair-cycle the module tier does not
# have (decision-check record, MAJOR finding).
[[constraint]]
type = "no_cycles"
modules = ["scan-core", "scan-leg", "scan-ts", "scan-python", "scan-kotlin"]
