[package]
name = "rust-arch-test-kit"
version = "0.6.69"  # released — entry lives in CHANGELOG.md under [0.6.42]; do not bump past the tag until the release commit
edition = "2024"

rust-version = "1.99"
description = "archspec CLI: architecture scan, verify and diagrams for Rust projects, with the shared Rust-parsing/rendering engine it links"
license = "Apache-2.0"
publish = ["gitea"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
quick-xml = "0.42"
toml = "0.8"
walkdir = "2.5"
tree-sitter = "0.24"
# Exact pin: grammar ABI 15 (tree-sitter-c-sharp >= 0.23.2) needs runtime >= 0.25;
# 0.23.1 carries ABI 14, matching the runtime 0.24 pin (ADR-014). The proven
# in-repo combination resolves the same version.
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-go = "0.23"
# Exact pins under the same ABI discipline: the pinned pair was probed
# in-repo against the runtime 0.24 pin on 2026-10-16 — set_language clean,
# `.ts` (generics, interfaces), `.tsx` (JSX) and plain JS (template-literal
# dynamic imports) all parse. Grammar releases newer than these pins may
# carry a newer grammar ABI than the runtime speaks (ADR-014 law), so the
# combination moves only as a probed unit. The JavaScript sibling grammar
# answers `.js` and `.jsx` (D1). ADR-022.
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.23.1"
# Exact pin under the same probe-unit discipline (ADR-014, python driver
# record P2): tree-sitter-python 0.23.6 carries grammar ABI 14, matching the
# runtime 0.24 pin; the combination was probed in-repo (set_language clean,
# `import_statement`/`import_from_statement` extraction, error-free parses of
# relative and dotted forms). 0.25.0 carries the ABI-15 trap the pair above
# documents — the runtime bump is a SEPARATE decision, not part of this pin.
tree-sitter-python = "=0.23.6"
# Exact pin under the same probe-unit discipline (ADR-014): brokk-tree-sitter-kotlin
# 0.4.6 was probed in-repo against the runtime 0.24 pin — set_language clean, an
# error-free tree for package + import + declaration source. The canonical
# fwcd-family tree-sitter-kotlin crates did not resolve against this runtime
# pin when probed (grammar dependency conflict), so the kotlin grammar enters
# through this crate. The grammar moves only as a probed unit.
brokk-tree-sitter-kotlin = "=0.4.6"
# Exact pin under the same probe-unit discipline (ADR-014): this is the
# newest stable oxc_resolver release on crates.io at Lane R1 start, and the
# version whose resolution and error-payload behavior was measured end-to-end
# in the Lane R1 spike (every planted resolution class resolved as specified,
# no Node.js invoked — the measured basis of ADR-024). Releases newer than
# this pin may change the tsconfig-extends semantics or the ResolveError
# variant set the scan-layer seam maps exhaustively, so the combination moves
# only as a probed unit. ADR-024. Confined to the scan layer by the
# `forbid_external_crates` constraint in architecture.spec.toml.
oxc_resolver = "=11.24.3"

[lints.rust]
unused_imports = "deny"

[lints.clippy]
all = "deny"

# Release-profile rider (issue #33 program, decision-check 2026-11-09 M6):
# fat LTO and one codegen unit for every release build. Not the musl cure —
# a profile cannot fix a lock convoy — but a free cross-target gain measured
# by the parity sweep as a rider. No `target-cpu=native` (portability), no
# `panic = "abort"` (panic-recovery semantics stay unchanged).
[profile.release]
lto = "fat"
codegen-units = 1

# musl-only allocator gate (issue #33). The parallel fact leg allocates on
# every worker; musl's default allocator serializes those on a global lock,
# so under musl the parallel leg runs 2-3x SLOWER than serial while glibc
# scales. mimalloc's thread-local heaps remove the contention. This feature
# changes nothing by itself: the global_allocator in src/main.rs additionally
# requires cfg(target_env = "musl"), and the dependency below is
# target-gated, so gnu/darwin/windows dependency graphs and every dev/test
# build stay byte-unchanged. The release matrix enables the feature in the
# musl build steps only.
[features]
musl-alloc = ["dep:mimalloc"]
# Phase-profiling harness (GitHub issue #34, operator ruling): the ONLY
# consumer of hotpath is the dev-only `phase-probe` example, so enabling
# this feature turns hotpath's measurement machinery on exactly there. The
# shipped dependency graph cannot change by construction — hotpath is a
# dev-dependency and the resolver never links dev edges into a binary
# target (resolver v2 rule); tests/profile_gate.rs proves it per platform.
# A binary build with this feature fails loud in src/main.rs.
profile-phases = ["hotpath/hotpath", "hotpath/threads"]

[target.'cfg(target_env = "musl")'.dependencies]
# Exact pin (ADR-014 discipline): the allocator combination moves only as a
# probed unit. default-features = false keeps the resolved graph minimal.
# The `override` feature additionally defines the malloc-family symbols (the
# mimalloc static lib wins the static-link resolution), so the C-side
# allocations of the embedded tree-sitter grammars — which a Rust
# `#[global_allocator]` cannot reach — also leave musl's locked allocator.
# Measured: without `override` the parallel-vs-serial inversion persisted
# (lane sweep 2026-11-09); with it the cure reaches the C allocations.
mimalloc = { version = "=0.1.52", optional = true, default-features = false, features = ["override"] }

[dev-dependencies]
tempfile = "3.24.0"
# Phase-profiling harness (GitHub issue #34): dev-dependency ONLY, per the
# operator ruling — hotpath code never links into a shipped binary. With the
# `profile-phases` feature off (every gate, every release build) the crate
# compiles to its no-op macro shell; the feature, enabled only by the
# `phase-probe` example, switches on its measurement machinery in dev
# targets. The graph proof lives in tests/profile_gate.rs.
hotpath = { version = "=0.31.1", default-features = false }

# The profiling harness itself: `cargo run --release --example phase-probe
# --features profile-phases -- <corpus-tree> [runs]`. Skipped by every
# default build and every gate through required-features.
[[example]]
name = "phase-probe"
path = "examples/phase_probe.rs"
required-features = ["profile-phases"]

[[bin]]
name = "archspec"
path = "src/main.rs"
