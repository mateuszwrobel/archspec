[package]
name = "rust-arch-test-kit"
version = "0.6.0"  # released — entry lives in CHANGELOG.md under [0.6.0]; do not bump past the tag until the release commit; the 0.6.0 line carries the exit-taxonomy retrofit — usage errors exit 64, undeclared verbs exit 64, a missing spec answers 70 — a breaking change to the public exit surface; releases at 0.5.x and older age out through the deprecation note in that entry, never through a retro-shim; the relation-analysis playbook emitted as its own analysis skill (`archspec skill analysis`), with its README, agent-guide and skill wiring, and the .github/FUNDING.yml sponsorship file land on this same version line; the feature_matrix read-only-source gate fix (target-dir report regeneration with committed-copy byte check) lands on this same version line; the ADR-020 module-claim jurisdiction design record (plan, ADR and decision-check landed together) lands on this same version line; the nested-submodule dependency engagement implementation (most-specific-claim adjudication at depth, policy inheritance, the containment law, claim-engagement warnings, depth-rendered spec diagrams) lands on this same version line; the submodule dependency engagement audit fixups (Breaking release note, workplan amendment, fan-out restatements, duplicate-name weld) land on this same version line; the report findings render fix (constraint-tier categories printed by every renderer, the exit gate and the renderers sharing one field list, the silent-red guard) lands on this same version line; the scan-diagram module-tier adjudication seam extraction lands on this same version line; the scan diagram module tier (opt-in --tiers, claim-named module identity, shared-adjudication marking with the always-on unit-tier ceiling-mark fix, ADR-021) lands on this same version line; the contract expose chain law (contract.expose un-reserved at every depth — the deepest-claim crossing adjudication, staleness and vacuity carriers, C# root-territory exclusion, the go vacuity rewrite, diagram --module/--modules-dir per the widened adjudication seam, the stderr version footer) lands on this same version line; the release-prep changelog rollup for 0.6.0 lands on this same version line
edition = "2024"

rust-version = "1.99"
description = "archspec CLI: architecture scan, verify and diagrams for Rust projects, with the shared Rust-parsing/rendering engine it links"
license = "Apache-2.0"
publish = ["gitea"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
quick-xml = "0.42"
toml = "0.8"
walkdir = "2.5"
tree-sitter = "0.24"
# Exact pin: grammar ABI 15 (tree-sitter-c-sharp >= 0.23.2) needs runtime >= 0.25;
# 0.23.1 carries ABI 14, matching the runtime 0.24 pin (ADR-014). The proven
# in-repo combination resolves the same version.
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-go = "0.23"

[lints.rust]
unused_imports = "deny"

[lints.clippy]
all = "deny"

[dev-dependencies]
tempfile = "3.24.0"

[[bin]]
name = "archspec"
path = "src/main.rs"
