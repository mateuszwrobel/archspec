[package]
name = "rust-arch-test-kit"
version = "0.5.2"  # released — entry lives in CHANGELOG.md under [0.5.0]; do not bump past the tag until the release commit; the 0.5.0 retag carries the aarch64-musl release-build fix; this tree adds the Apache-2.0 license file and the generated credits listing at an unchanged version; the self-dogfood spec hardening — the depgraph engine attribution, the public_api_allowlist, forbid_external_crates and manifest_integrity constraints and the honest attribution comments — lands on this same version line; the diagnostics-help catalog relocation into the foundations layer lands on this same version line; the library-import source guard and the honest self-dogfood README land on this same version line; the cargo-test self-verify leg lands on this same version line; the csharp public-api surface facts land on this same version line; the csharp public-api allowlist enforcement lands on this same version line; the csharp engagement-honesty vocabulary and the public-api-surface capability fact land on this same version line; the csharp public-api manual, acceptance rows and ADR land on this same version line; the csharp corporate public-api corpus pin lands on this same version line; the csharp root identity ladder lands on this same version line; the csharp per-unit role merge lands on this same version line; the csharp composition gate and registration family land on this same version line; the csharp facade evidence shapes land on this same version line; the unit-header marker identity and the stated depgraph fold land on this same version line; the corporate roles-matrix corpus and the composition-predicate acceptance reword land on this same version line; the csharp conflicting-fold corporate naming corpus pin lands on this same version line; the csharp public-api unit-root comment reword lands on this same version line; the release-prep changelog rollup for 0.5.2 lands on this same version line
edition = "2021"

rust-version = "1.94"
description = "archspec CLI: architecture scan, verify and diagrams for Rust projects, with the shared Rust-parsing/rendering engine it links"
license = "Apache-2.0"
publish = ["gitea"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
quick-xml = "0.42"
toml = "0.8"
walkdir = "2.5"
tree-sitter = "0.24"
# Exact pin: grammar ABI 15 (tree-sitter-c-sharp >= 0.23.2) needs runtime >= 0.25;
# 0.23.1 carries ABI 14, matching the runtime 0.24 pin (ADR-014). The proven
# in-repo combination resolves the same version.
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-go = "0.23"

[dev-dependencies]
tempfile = "3.24.0"

[[bin]]
name = "archspec"
path = "src/main.rs"
