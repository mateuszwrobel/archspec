[package]
name = "rust-arch-test-kit"
version = "0.4.159"
edition = "2021"
rust-version = "1.94"
description = "archspec CLI: architecture scan, verify and diagrams for Rust projects, with the shared Rust-parsing/rendering engine it links"
license = "MIT"
publish = ["gitea"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
quick-xml = "0.42"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.24.0"

[[bin]]
name = "archspec"
path = "src/main.rs"
